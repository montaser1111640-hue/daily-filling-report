    <!-- شاشة باسورد بسيطة للواجهة -->
<div id="appLockScreen" style="
  position: fixed;
  inset: 0;
  background: #111827;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  z-index: 999999;
  padding: 20px;
  font-family: sans-serif;
">
  <h3 style="margin: 0;">دخول التطبيق</h3>
  <p style="margin: 0; font-size: 14px; color: #d1d5db;">اكتب رمز الدخول للمتابعة</p>

  <input
    id="appPassInput"
    type="password"
    inputmode="numeric"
    placeholder="اكتب الباسورد"
    style="
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #1f2937;
      color: #fff;
      font-size: 16px;
      width: 220px;
      text-align: center;
    "
  />

  <button
    id="appUnlockBtn"
    type="button"
    style="
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      background: #16a34a;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    "
  >
    دخول
  </button>

  <div id="appPassError" style="color: #f87171; font-size: 13px; min-height: 18px;"></div>
</div>

<script>
  (function () {
    const CORRECT_PASS = "1978";
    const lockScreen = document.getElementById("appLockScreen");
    const input = document.getElementById("appPassInput");
    const btn = document.getElementById("appUnlockBtn");
    const errorBox = document.getElementById("appPassError");

    if (sessionStorage.getItem("filling_app_unlocked") === "1") {
      lockScreen.style.display = "none";
    }

    function checkPass() {
      if (input.value.trim() === CORRECT_PASS) {
        sessionStorage.setItem("filling_app_unlocked", "1");
        lockScreen.style.display = "none";
        errorBox.textContent = "";
      } else {
        errorBox.textContent = "الباسورد غلط، جرب تاني";
        input.value = "";
        input.focus();
      }
    }

    btn.addEventListener("click", checkPass);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") checkPass();
    });
  })();
</script>
